
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 30px auto;
        }

        figure {
            margin: 0;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ccc;
        }

        figure img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        figcaption {
            text-align: center;
            padding: 10px 0;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <h1>My Photo Gallery</h1>

    <div class="gallery">
        <figure>
            <img src="https://placehold.co/400x250?text=Nature" alt="Placeholder for nature">
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x250?text=Travel" alt="Placeholder for travel">
            <figcaption>Travel</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x250?text=Technology" alt="Placeholder for technology">
            <figcaption>Technology</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x250?text=Food" alt="Placeholder for food">
            <figcaption>Food</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x250?text=Architecture" alt="Placeholder for architecture">
            <figcaption>Architecture</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x250?text=Wildlife" alt="Placeholder for wildlife">
            <figcaption>Wildlife</figcaption>
        </figure>
    </div>
</body>
</html>
