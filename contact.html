<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us – full form</title>
</head>
<body>
  <div class="form-container">
    <h1>📬 Get in touch</h1>
    <div class="form-subhead">
      Fill out the form and we'll respond within 24 hours.
    </div>

    <form action="#" method="post" novalidate>

      <!-- ========== FIELDSET 1: Personal info ========= -->
      <fieldset>
        <legend>Your details</legend>

        <!-- Full name (required) -->
        <div class="form-row">
          <label for="fullName">
            Full name <span class="required-star" aria-hidden="true">*</span>
          </label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="e.g. Rodricks Okoyo"
            required
            autocomplete="name"
          />
        </div>

        <!-- Email (required, with built‑in email validation) -->
        <div class="form-row">
          <label for="email">
            Email address <span class="required-star" aria-hidden="true">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
          <span class="hint">We'll never share your email.</span>
        </div>

        <!-- Phone (optional) -->
        <div class="form-row">
          <label for="phone">Phone number <span style="font-weight:400; color:#62748c;">(optional)</span></label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+254 700 000 000"
            autocomplete="tel"
          />
        </div>
      </fieldset>

      <!-- ========== FIELDSET 2: Message & subject ========= -->
      <fieldset>
        <legend>Your message</legend>

        <!-- Subject dropdown (3 options) -->
        <div class="form-row">
          <label for="subject">Subject <span class="required-star" aria-hidden="true">*</span></label>
          <select id="subject" name="subject" required>
            <option value="" disabled selected>— Select a topic —</option>
            <option value="general">General inquiry</option>
            <option value="support">Technical support</option>
            <option value="feedback">Feedback & suggestions</option>
          </select>
        </div>

        <!-- Message textarea (required, min 50 chars via minlength) -->
        <div class="form-row">
          <label for="message">
            Message <span class="required-star" aria-hidden="true">*</span>
          </label>
          <textarea
            id="message"
            name="message"
            placeholder="Please describe your question or comment in at least 50 characters…"
            required
            minlength="50"
          ></textarea>
          <span class="hint">Minimum 50 characters. <span id="charCount">0</span> characters entered.</span>
        </div>
      </fieldset>

      <!-- ========== Newsletter checkbox ========= -->
      <div class="checkbox-group">
        <input type="checkbox" id="newsletter" name="newsletter" value="yes" />
        <label for="newsletter">
          Subscribe to our newsletter – monthly updates, no spam. You can unsubscribe anytime.
        </label>
      </div>

      <!-- Submit button -->
      <button type="submit">Send message</button>

    </form>

    <!-- ========== SOCIAL MEDIA + LOCATION / TIMEZONE ========= -->
    <div class="social-location">

      <!-- Social media links -->
      <div class="social-block">
        <h3>Follow us</h3>
        <div class="social-icons">
         
          <!-- LinkedIn -->
          <a href="https://linkedin.com/in/rodricks-okoyo-218960255/"
            class="social-link" aria-label="LinkedIn" title="LinkedIn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </a>
          
          <!-- GitHub -->
          <a href="https://github.com/okoyo13" 
            class="social-link" aria-label="GitHub" title="GitHub">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
            </svg>
          </a>
          
      </div>

      <!-- Location & timezone -->
      <div class="location-block">
        <h3>Location & timezone</h3>
        <div class="location-details">
          <div>
            <span class="label">📍 Headquarters:</span><br>
            Nairobi,<br>
            Kenya.
          </div>
          <div style="margin-top: 0.6rem;">
            <span class="label">🕒 Timezone:</span>
            <span class="timezone"> UTC/GMT +3·</span>
          </div>
          <div style="margin-top: 0.5rem; font-size: 0.9rem;">
            <span class="label">📞 Phone:</span> <a href="tel:+254 795 513 310">+254 795 513 310</a>
          </div>
        </div>
      </div>

    </div>
    <!-- end social-location -->

  </div>

  <!-- small script to display live character count (optional, purely cosmetic) -->
  <script>
    (function() {
      const message = document.getElementById('message');
      const charSpan = document.getElementById('charCount');
      if (message && charSpan) {
        const updateCount = () => {
          const len = message.value.length;
          charSpan.textContent = len;
        };
        message.addEventListener('input', updateCount);
        updateCount(); // initial
      }
    })();
  </script>
</body>
</html>
